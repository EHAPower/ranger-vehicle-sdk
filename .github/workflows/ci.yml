name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BUILD_IMAGE: ghcr.io/ehapower/devcontainers@sha256:6ddb76f2040771104972a4323f1cff343baa7bb57aaf5ae77711b7ebb7fc709d

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: 容器内运行 Rust 门禁
        run: |
          set -euo pipefail
          mkdir -p target .cache/cargo/registry .cache/cargo/git .tmp
          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/.cache/cargo/registry,dst=/workspace/.cache/cargo/registry" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/.cache/cargo/git,dst=/workspace/.cache/cargo/git" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/target,dst=/workspace/target" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/.tmp,dst=/workspace/.tmp" \
            -e CARGO_HOME=/workspace/.cache/cargo \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e TMPDIR=/workspace/.tmp \
            -w /workspace \
            "${BUILD_IMAGE}" bash -lc '
              set -euo pipefail
              cargo fmt --all -- --check
              cargo clippy --locked --workspace --all-targets -- -D warnings
              cargo test --locked --workspace
              cargo build --locked --release
            '
