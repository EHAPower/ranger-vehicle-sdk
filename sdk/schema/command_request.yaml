schema_kind: ranger.schema.v1
schema_id: command_request
schema_version: ranger.command_request.v2
title: Ranger command request schema
status: active
owner: sdk/schema
compatibility:
  mode: strict
  unknown_fields: reject
  stable_id_policy: never_reuse
  migration_required: true
hash:
  canonicalization: semantic_projection_v2
  semantic_inputs:
    - schema_kind
    - schema_id
    - schema_version
    - compatibility
    - structures
structures:
  - name: FrameHeader
    description: Request and control-session identity plus the source clock timestamp.
    fields:
      - name: request_id
        type: uint64
        required: true
      - name: session_id
        type: uint64
        required: true
      - name: source_timestamp_ns
        type: uint64
        required: true
        unit: ns
      - name: source_clock
        type: enum
        required: true
        enum_values:
          - monotonic
          - epoch
          - unspecified
  - name: ControlFrame
    description: Vehicle-level command frame accepted by Ranger Server gate.
    fields:
      - name: header
        type: object
        required: true
      - name: sequence
        type: uint64
        required: true
        unit: count
      - name: valid_for_ms
        type: uint64
        required: true
        unit: ms
      - name: expected_mode
        type: enum
        required: true
        enum_values:
          - standby
          - manual
          - auto
          - maintenance
          - self_test
      - name: command_epoch
        type: uint64
        required: true
        unit: count
      - name: profile_id
        type: string
        required: true
      - name: commands
        type: array
        required: true
        items: VehicleCommand
  - name: VehicleCommand
    description: One resource-scoped vehicle command inside a frame.
    fields:
      - name: command_id
        type: string
        required: true
      - name: resource
        type: enum
        required: true
        enum_values:
          - vehicle.motion
          - vehicle.suspension
          - vehicle.corner.front_left
          - vehicle.corner.front_right
          - vehicle.corner.rear_right
          - vehicle.corner.rear_left
      - name: target
        type: object
        required: true
      - name: units
        type: array
        required: true
        items: UnitSpec
  - name: CommandTarget
    description: Ordered free-form target fields represented by Rust tuples of field name and float64 value; the gate validates allowed fields.
    fields:
      - name: fields
        type: array
        required: true
        items: "(string, float64)"
  - name: UnitSpec
    description: Unit annotation for one target field.
    fields:
      - name: field
        type: string
        required: true
      - name: unit
        type: string
        required: true
  - name: StopCommand
    description: >-
      Explicit safe-stop request. Accepted only starts an operation; terminal
      backend confirmation is exposed through OperationEvent.
    fields:
      - name: header
        type: object
        required: true
      - name: sequence
        type: uint64
        required: true
        unit: count
      - name: valid_for_ms
        type: uint64
        required: true
        unit: ms
      - name: expected_mode
        type: enum
        required: true
        enum_values: [standby, manual, auto, maintenance, self_test]
      - name: command_epoch
        type: uint64
        required: true
        unit: count
      - name: reason_code
        type: string
        required: true
  - name: ModeRequest
    description: The only external request that can select an operation mode.
    fields:
      - name: header
        type: object
        required: true
      - name: valid_for_ms
        type: uint64
        required: true
        unit: ms
      - name: expected_mode
        type: enum
        required: true
        enum_values: [standby, manual, auto, maintenance, self_test]
      - name: command_epoch
        type: uint64
        required: true
        unit: count
      - name: target_mode
        type: enum
        required: true
        enum_values: [standby, manual, auto, maintenance, self_test]
      - name: reason_code
        type: string
        required: true
  - name: ClearFaultsRequest
    description: Requests a supervised clear; the caller cannot assert that a fault disappeared.
    fields:
      - name: header
        type: object
        required: true
      - name: valid_for_ms
        type: uint64
        required: true
        unit: ms
      - name: expected_mode
        type: enum
        required: true
        enum_values: [standby, manual, auto, maintenance, self_test]
      - name: command_epoch
        type: uint64
        required: true
        unit: count
      - name: reason_code
        type: string
        required: true
  - name: OperationMode
    description: Vehicle operation mode; normal command frames assert it and never change it.
    fields:
      - name: value
        type: enum
        required: true
        enum_values:
          - standby
          - manual
          - auto
          - maintenance
          - self_test
  - name: EhaFaultResetCommand
    description: >-
      Explicit reset of the EHA-domain fault latch (isolated variants) for the
      active control session. Rejected with estop_active while the global
      E-Stop is latched; the server re-latches within the same rt_control cycle
      if the fault cause is still present.
    fields:
      - name: header
        type: object
        required: true
      - name: reason_code
        type: string
        required: true
