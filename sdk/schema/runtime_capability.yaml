schema_kind: ranger.schema.v1
schema_id: runtime_capability
schema_version: ranger.runtime_capability.v1
title: Ranger runtime capability schema
status: active
owner: sdk/schema
compatibility:
  mode: strict
  unknown_fields: reject
  stable_id_policy: never_reuse
  migration_required: true
hash:
  canonicalization: yaml_to_canonical_json_v1
  aggregate_member: true
  semantic_inputs:
    - schema_kind
    - schema_id
    - schema_version
    - compatibility
    - structures
structures:
  - name: RuntimeCapabilityReport
    description: Backend capability summary consumed by release/profile checker and diagnostics.
    fields:
      - name: report_id
        type: string
        required: true
      - name: schema_version
        type: string
        required: true
      - name: generated_at
        type: timestamp_rfc3339
        required: true
      - name: profile_id
        type: string
        required: true
      - name: release_id
        type: string
        required: true
      - name: backend_reports
        type: array
        required: true
        items: BackendInstanceCapability
      - name: capability_statuses
        type: array
        required: true
        items: CapabilityStatus
      - name: report_hash
        type: sha256
        required: true
        unit: sha256
      - name: disabled_reason
        type: string
        required: false
  - name: BackendInstanceCapability
    description: One backend instance binding and required motion-readiness capability.
    fields:
      - name: backend_id
        type: string
        required: true
      - name: backend_schema_version
        type: string
        required: true
      - name: instance_id
        type: string
        required: true
      - name: instance_binding
        type: string
        required: true
      - name: resources
        type: array
        required: true
        items: string
      - name: command
        type: bool
        required: true
      - name: feedback
        type: bool
        required: true
      - name: fault
        type: bool
        required: true
      - name: safe_output
        type: bool
        required: true
      - name: stop_confirmation
        type: object
        required: true
      - name: feedback_freshness_ms
        type: uint64
        required: true
        unit: ms
      - name: fault_mapping
        type: array
        required: true
        items: FaultMapping
  - name: StopConfirmation
    description: Stop confirmation contract for backend motion disable and fault mapping.
    fields:
      - name: timeout_ms
        type: uint64
        required: true
        unit: ms
      - name: success_condition
        type: string
        required: true
      - name: failure_reason_code
        type: string
        required: true
      - name: safe_output_required
        type: bool
        required: true
  - name: CapabilityStatus
    description: Capability availability state used by diagnostics and field bundle.
    fields:
      - name: capability_id
        type: string
        required: true
      - name: status
        type: enum
        required: true
        enum_values:
          - available
          - declared_absent
          - optional
          - degraded_capability
          - blocked
      - name: disabled_reason
        type: string
        required: false
  - name: FaultMapping
    description: Backend fault or stale condition mapping into checker reason and safety effect.
    fields:
      - name: fault_id
        type: string
        required: true
      - name: reason_code
        type: string
        required: true
      - name: safety_effect
        type: enum
        required: true
        enum_values:
          - none
          - read_only_only
          - install_blocked
          - switch_blocked
          - daemon_start_blocked
          - motion_disabled
          - motion_blocked
          - fault_latched
