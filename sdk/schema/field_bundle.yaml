schema_kind: ranger.schema.v1
schema_id: field_bundle
schema_version: ranger.field_bundle.v1
title: Ranger field bundle schema
status: active
owner: sdk/schema
compatibility:
  mode: additive
  unknown_fields: allow_append_only
  stable_id_policy: never_reuse
  migration_required: true
hash:
  canonicalization: yaml_to_canonical_json_v1
  aggregate_member: true
  semantic_inputs:
    - schema_kind
    - schema_id
    - schema_version
    - compatibility
    - structures
structures:
  - name: FieldBundleManifest
    description: Read-only evidence export manifest.
    fields:
      - name: bundle_id
        type: string
        required: true
      - name: schema_version
        type: string
        required: true
      - name: exported_at
        type: timestamp_rfc3339
        required: true
      - name: vehicle_id
        type: string
        required: true
      - name: release_id
        type: string
        required: true
      - name: profile_id
        type: string
        required: true
      - name: aggregate_schema_hash
        type: sha256
        required: true
        unit: sha256
      - name: check_registry_hash
        type: sha256
        required: true
        unit: sha256
      - name: segments
        type: array
        required: true
        items: RecorderSegment
      - name: redaction
        type: array
        required: true
        items: RedactionRule
  - name: RecorderSegment
    description: DiagnosticsRecorder segment included in the bundle.
    fields:
      - name: segment_id
        type: string
        required: true
      - name: monotonic_start_ns
        type: uint64
        required: true
        unit: ns
      - name: monotonic_end_ns
        type: uint64
        required: true
        unit: ns
      - name: sha256
        type: sha256
        required: true
        unit: sha256
  - name: EvidenceReference
    description: Reference to target, HIL, bench, static vehicle, or field evidence.
    fields:
      - name: capability
        type: string
        required: true
      - name: evidence_level
        type: enum
        required: true
        enum_values:
          - L0_host_unit
          - L1_target_smoke
          - L2_replay_fault_injection
          - L3_hil
          - L4_bench
          - L5_integrated_bench
          - L6_static_vehicle
          - L7_field_soak
      - name: reference
        type: string
        required: true
      - name: unproven_scope
        type: array
        required: true
        items: string
  - name: RedactionRule
    description: Non-secret export filter applied before bundle publication.
    fields:
      - name: rule_id
        type: string
        required: true
      - name: path
        type: string
        required: true
      - name: action
        type: enum
        required: true
        enum_values:
          - keep
          - redact
          - omit
  - name: FieldBundleRecord
    description: Replayable checker readiness record embedded in diagnostics and field bundle exports.
    fields:
      - name: schema_version
        type: string
        required: true
      - name: record_id
        type: string
        required: true
      - name: operation
        type: enum
        required: true
        enum_values:
          - dry_run
          - read_only_diagnostics
          - deploy_preflight
          - install
          - switch_current
          - daemon_startup
          - motion_capable_start
          - developer_commissioning_motion
      - name: status
        type: enum
        required: true
        enum_values:
          - pass
          - pass_with_ignored_checks
          - read_only
          - blocked
          - invalid_invocation
          - internal_error
      - name: ready_for_motion
        type: bool
        required: true
      - name: motion_disabled_reason
        type: string
        required: false
      - name: release_id
        type: string
        required: false
      - name: profile_id
        type: string
        required: false
      - name: aggregate_schema_hash
        type: sha256
        required: false
        unit: sha256
      - name: check_registry_hash
        type: sha256
        required: true
        unit: sha256
      - name: capability_hash
        type: sha256
        required: false
        unit: sha256
      - name: ignored_checks
        type: array
        required: true
        items: FieldBundleIgnoredCheck
      - name: reason_codes
        type: array
        required: true
        items: string
      - name: evidence
        type: array
        required: true
        items: EvidenceReference
  - name: FieldBundleIgnoredCheck
    description: Scoped ignored check replay entry with safety effect.
    fields:
      - name: check_id
        type: string
        required: true
      - name: reason_code
        type: string
        required: true
      - name: safety_effect
        type: enum
        required: true
        enum_values:
          - none
          - read_only_only
          - install_blocked
          - switch_blocked
          - daemon_start_blocked
          - motion_disabled
          - motion_blocked
          - fault_latched
