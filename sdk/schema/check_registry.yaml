registry_kind: ranger.check_registry.v1
registry_id: ranger_check_registry
registry_version: ranger.check_registry.v1
title: Ranger release/profile checker registry
status: active
owner: sdk/schema
hash:
  canonicalization: yaml_to_canonical_json_v1
  semantic_inputs:
    - registry_kind
    - registry_id
    - registry_version
    - checks
checks:
  - check_id: release.schema_hash_match
    description: Release manifest aggregate schema hash must match the checker schema set.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
    reason_code: release_schema_hash_mismatch
    output_fields:
      - release.aggregate_schema_hash
      - checker.aggregate_schema_hash
      - release.schema_hashes
    ignorable_for_commissioning: false
  - check_id: release.check_registry_hash_match
    description: Release manifest check registry hash must match the checker registry.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
    reason_code: release_check_registry_hash_mismatch
    output_fields:
      - release.check_registry_hash
      - checker.check_registry_hash
    ignorable_for_commissioning: false
  - check_id: release.profile_supported
    description: Active profile id must be explicitly supported by the release manifest.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
    reason_code: release_profile_not_supported
    output_fields:
      - release.supported_profiles
      - active_config.profile.ref_id
    ignorable_for_commissioning: false
  - check_id: active_config.release_id_match
    description: Active config release reference must match the release manifest.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
    reason_code: active_config_release_id_mismatch
    output_fields:
      - release.release_id
      - active_config.release.ref_id
    ignorable_for_commissioning: false
  - check_id: active_config.profile_id_match
    description: Active config profile reference must match the loaded platform profile.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
    reason_code: active_config_profile_id_mismatch
    output_fields:
      - active_config.profile.ref_id
      - profile.profile_id
    ignorable_for_commissioning: false
  - check_id: config.calibration_hash_match
    description: Active config calibration hash must match the loaded calibration bundle.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
    reason_code: calibration_hash_mismatch
    output_fields:
      - active_config.calibration.sha256
      - calibration.sha256
    ignorable_for_commissioning: false
  - check_id: config.safety_hash_match
    description: Active config safety hash must match the loaded safety profile.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
    reason_code: safety_hash_mismatch
    output_fields:
      - active_config.safety.sha256
      - safety.sha256
    ignorable_for_commissioning: false
  - check_id: config.runtime_hash_match
    description: Active config runtime hash must match the loaded runtime config.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
    reason_code: runtime_hash_mismatch
    output_fields:
      - active_config.runtime.sha256
      - runtime.sha256
    ignorable_for_commissioning: false
  - check_id: config.field_override_tightens_safety_limit
    description: Field overrides must not relax, replace, remove, or bypass safety-critical limits.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
      - developer_commissioning_motion
    reason_code: field_override_not_tightening_safety_limit
    output_fields:
      - active_config.field_overrides
      - safety.limits
      - override.direction
    ignorable_for_commissioning: false
  - check_id: profile.required_topology_present
    description: Platform profile must declare required compute, bus, sensor, backend, and time-sync topology.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
    reason_code: profile_required_topology_missing
    output_fields:
      - profile.compute
      - profile.bus_topology
      - profile.sensor_topology
      - profile.backend_mapping
    ignorable_for_commissioning: false
  - check_id: profile.commissioning_state_allows_operation
    description: Commissioning state and evidence level must allow the requested operation.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
      - developer_commissioning_motion
    reason_code: commissioning_state_disallows_operation
    output_fields:
      - profile.commissioning_state
      - profile.evidence_level
      - operation
    ignorable_for_commissioning: false
  - check_id: target_facts.source_compatible
    description: Target facts source type, host binding, timestamp, and collector version must be compatible with the requested operation.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
      - developer_commissioning_motion
    reason_code: target_facts_source_not_compatible
    output_fields:
      - target_facts.source_type
      - target_facts.host_binding
      - target_facts.collected_at
      - target_facts.collector_version
    ignorable_for_commissioning: true
  - check_id: target_facts.power_thermal_available
    description: Required power and thermal facts must be accessible and fresh for the requested operation.
    severity: blocked
    operations:
      - deploy_preflight
      - daemon_startup
      - motion_capable_start
      - developer_commissioning_motion
    reason_code: target_facts_power_thermal_unavailable
    output_fields:
      - target_facts.power_thermal
      - profile.power_thermal
      - operation
    ignorable_for_commissioning: true
  - check_id: target_facts.irq_affinity_compatible
    description: Required CAN IRQ affinity facts must be accessible and compatible with the active real-time CPU allocation.
    severity: blocked
    operations:
      - deploy_preflight
      - daemon_startup
      - motion_capable_start
      - developer_commissioning_motion
    reason_code: target_facts_irq_affinity_conflict
    output_fields:
      - target_facts.irq_affinity
      - profile.cpu_affinity
      - profile.irq_affinity
    ignorable_for_commissioning: true
  - check_id: optional_sensor.declared_status
    description: Missing optional or vehicle-absent sensors must be declared by profile or runtime capability.
    severity: blocked
    operations:
      - deploy_preflight
      - daemon_startup
      - motion_capable_start
      - developer_commissioning_motion
    reason_code: optional_sensor_status_not_declared
    output_fields:
      - profile.sensor_topology
      - capability.sensor_status
    ignorable_for_commissioning: true
  - check_id: probe.availability_known
    description: Required read-only backend or device probes must report availability or a declared limitation.
    severity: blocked
    operations:
      - deploy_preflight
      - daemon_startup
      - motion_capable_start
      - developer_commissioning_motion
    reason_code: probe_availability_unknown
    output_fields:
      - target_facts.capability_probe
      - capability.backend_reports
    ignorable_for_commissioning: true
  - check_id: hardware_variant.declared_match
    description: Declared hardware variant must match target facts or carry an explicit commissioning limitation.
    severity: blocked
    operations:
      - deploy_preflight
      - install
      - switch_current
      - daemon_startup
      - motion_capable_start
      - developer_commissioning_motion
    reason_code: hardware_variant_mismatch
    output_fields:
      - profile.compute_target
      - profile.bus_topology
      - target_facts.arch
      - target_facts.network_interfaces
    ignorable_for_commissioning: true
  - check_id: capability.required_backend_available
    description: Runtime capability report must provide every backend capability required by the active profile.
    severity: blocked
    operations:
      - deploy_preflight
      - daemon_startup
      - motion_capable_start
      - developer_commissioning_motion
    reason_code: required_backend_capability_missing
    output_fields:
      - profile.backend_mapping
      - capability.backend_reports
    ignorable_for_commissioning: false
  - check_id: capability.stop_confirmation_available
    description: Motion-capable backends must report safe output and stop confirmation contracts.
    severity: blocked
    operations:
      - deploy_preflight
      - daemon_startup
      - motion_capable_start
      - developer_commissioning_motion
    reason_code: stop_confirmation_capability_missing
    output_fields:
      - capability.backend_reports.stop_confirmation
      - capability.backend_reports.safe_output
    ignorable_for_commissioning: false
