schema_kind: ranger.schema.v1
schema_id: receipt_event
schema_version: ranger.receipt_event.v2
title: Ranger receipt and event schema
status: active
owner: sdk/schema
compatibility:
  mode: strict
  unknown_fields: reject
  stable_id_policy: never_reuse
  migration_required: true
hash:
  canonicalization: semantic_projection_v2
  semantic_inputs:
    - schema_kind
    - schema_id
    - schema_version
    - compatibility
    - structures
structures:
  - name: GateReceipt
    description: Synchronous SDK response for command and operation gate decisions.
    fields:
      - name: receipt_id
        type: string
        required: true
      - name: request_id
        type: uint64
        required: true
      - name: status
        type: enum
        required: true
        enum_values:
          - accepted
          - rejected
      - name: reason_code
        type: string
        required: true
      - name: affected_resource
        type: string
        required: false
  - name: StopExecutionEvent
    description: Asynchronous observation result for an accepted StopCommand.
    fields:
      - name: event_id
        type: string
        required: true
      - name: request_id
        type: uint64
        required: true
      - name: command_epoch
        type: uint64
        required: true
        unit: count
      - name: status
        type: enum
        required: true
        enum_values:
          - observed
          - timed_out
          - failed
      - name: reason
        type: string
        required: true
      - name: confirmation_source
        type: string
        required: false
      - name: server_timestamp_ns
        type: uint64
        required: true
        unit: ns
  - name: OperationReceipt
    description: >-
      Synchronous admission result for ModeRequest, StopCommand, and
      ClearFaultsRequest. accepted does not prove completion or safe output.
    fields:
      - name: receipt_id
        type: string
        required: true
      - name: request_id
        type: uint64
        required: true
      - name: status
        type: enum
        required: true
        enum_values:
          - accepted
          - rejected
      - name: operation_id
        type: string
        required: false
      - name: command_epoch
        type: uint64
        required: true
        unit: count
      - name: reason_code
        type: string
        required: true
  - name: OperationQuery
    description: Read-only query for the most recent state of one operation.
    fields:
      - name: request_id
        type: uint64
        required: true
      - name: operation_id
        type: string
        required: true
  - name: OperationEvent
    description: Latest transition, stop confirmation, completion, or failure event for an operation.
    fields:
      - name: event_id
        type: string
        required: true
      - name: operation_id
        type: string
        required: true
      - name: operation_kind
        type: enum
        required: true
        enum_values:
          - mode_transition
          - stop
          - disable_motion
          - clear_faults
          - maintenance
          - self_test
          - generic_claim
      - name: phase
        type: enum
        required: true
        enum_values:
          - accepted
          - stopping
          - awaiting_stop_confirmation
          - entering_target_mode
          - running
          - safe_exit
          - completed
          - failed
          - timed_out
          - aborted
      - name: operation_mode
        type: enum
        required: true
        enum_values: [standby, manual, auto, maintenance, self_test]
      - name: safety_state
        type: enum
        required: true
        enum_values: [normal, degraded_hold, controlled_stop, fault_latched, estop_latched]
      - name: command_epoch
        type: uint64
        required: true
        unit: count
      - name: reason_code
        type: string
        required: true
      - name: server_timestamp_ns
        type: uint64
        required: true
        unit: ns
      - name: stop_result
        type: object
        required: false
  - name: StopOperationResult
    description: Aggregate terminal result; every claimed backend must independently confirm.
    fields:
      - name: operation_id
        type: string
        required: true
      - name: command_epoch
        type: uint64
        required: true
        unit: count
      - name: status
        type: enum
        required: true
        enum_values:
          - pending
          - confirmed
          - timed_out
          - failed
      - name: reason_code
        type: string
        required: true
      - name: backend_confirmations
        type: array
        required: true
        items: BackendStopConfirmation
      - name: server_timestamp_ns
        type: uint64
        required: true
        unit: ns
  - name: BackendStopConfirmation
    description: Backend-specific stop or safe-exit evidence; dispatch acknowledgement is insufficient.
    fields:
      - name: backend_id
        type: string
        required: true
      - name: status
        type: enum
        required: true
        enum_values:
          - pending
          - confirmed
          - timed_out
          - failed
          - unavailable
      - name: reason_code
        type: string
        required: true
      - name: observed_at_ns
        type: uint64
        required: true
        unit: ns
  - name: OperationMode
    description: Shared operation-mode enum for receipts and events.
    fields:
      - name: value
        type: enum
        required: true
        enum_values:
          - standby
          - manual
          - auto
          - maintenance
          - self_test
  - name: SessionGrant
    description: Frozen permission intersection returned with an accepted session handshake.
    fields:
      - name: allowed_modes
        type: array
        required: true
        items: OperationMode
      - name: allowed_operations
        type: array
        required: true
        items: OperationKind
      - name: capability_hash
        type: sha256
        required: false
        unit: sha256
  - name: SafetyState
    description: Supervisor safety overlay, independent of operation mode.
    fields:
      - name: value
        type: enum
        required: true
        enum_values:
          - normal
          - degraded_hold
          - controlled_stop
          - fault_latched
          - estop_latched
  - name: OperationKind
    description: Stable operation category used by SessionGrant and OperationEvent.
    fields:
      - name: value
        type: enum
        required: true
        enum_values:
          - mode_transition
          - stop
          - disable_motion
          - clear_faults
          - maintenance
          - self_test
          - generic_claim
