schema_kind: ranger.schema.v1
schema_id: receipt_event
schema_version: ranger.receipt_event.v1
title: Ranger receipt and event schema
status: active
owner: sdk/schema
compatibility:
  mode: strict
  unknown_fields: reject
  stable_id_policy: never_reuse
  migration_required: true
hash:
  canonicalization: yaml_to_canonical_json_v1
  aggregate_member: true
  semantic_inputs:
    - schema_kind
    - schema_id
    - schema_version
    - compatibility
    - structures
structures:
  - name: GateReceipt
    description: Synchronous SDK response for command and operation gate decisions.
    fields:
      - name: receipt_id
        type: string
        required: true
      - name: request_id
        type: uint64
        required: true
      - name: status
        type: enum
        required: true
        enum_values:
          - accepted
          - rejected
      - name: reason_code
        type: string
        required: true
      - name: affected_resource
        type: string
        required: false
  - name: StopExecutionEvent
    description: Asynchronous observation result for an accepted StopCommand.
    fields:
      - name: event_id
        type: string
        required: true
      - name: request_id
        type: uint64
        required: true
      - name: command_epoch
        type: uint64
        required: true
        unit: count
      - name: status
        type: enum
        required: true
        enum_values:
          - observed
          - timed_out
          - failed
      - name: reason
        type: string
        required: true
      - name: confirmation_source
        type: string
        required: false
      - name: server_timestamp_ns
        type: uint64
        required: true
        unit: ns
