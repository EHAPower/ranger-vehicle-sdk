schema_kind: ranger.schema.v1
schema_id: release_manifest
schema_version: ranger.release_manifest.v1
title: Ranger release manifest schema
status: active
owner: sdk/schema
compatibility:
  mode: strict
  unknown_fields: reject
  stable_id_policy: never_reuse
  migration_required: true
hash:
  canonicalization: yaml_to_canonical_json_v1
  aggregate_member: true
  semantic_inputs:
    - schema_kind
    - schema_id
    - schema_version
    - compatibility
    - structures
structures:
  - name: ReleaseManifest
    description: Immutable release bundle metadata and supported profile/capability set.
    fields:
      - name: release_id
        type: string
        required: true
      - name: release_version
        type: string
        required: true
      - name: built_at
        type: timestamp_rfc3339
        required: true
      - name: target_triple
        type: string
        required: true
      - name: binary_artifacts
        type: array
        required: true
        items: BinaryArtifact
      - name: schema_hashes
        type: array
        required: true
        items: SchemaHashEntry
      - name: aggregate_schema_hash
        type: sha256
        required: true
        unit: sha256
      - name: check_registry_hash
        type: sha256
        required: true
        unit: sha256
      - name: supported_profiles
        type: array
        required: true
        items: SupportedProfile
      - name: release_capabilities
        type: array
        required: true
        items: ReleaseCapability
  - name: BinaryArtifact
    description: Release binary or helper included in the immutable bundle.
    fields:
      - name: path
        type: string
        required: true
      - name: artifact_kind
        type: enum
        required: true
        enum_values:
          - ranger_cli
          - ranger_server
          - operator_client
          - maintenance_tool
          - ranger_check
          - systemd_unit
          - deploy_helper
      - name: sha256
        type: sha256
        required: true
        unit: sha256
  - name: SchemaHashEntry
    description: One formal schema file included in the release aggregate schema hash.
    fields:
      - name: file_name
        type: string
        required: true
      - name: schema_id
        type: string
        required: true
      - name: schema_version
        type: string
        required: true
      - name: compatibility_mode
        type: enum
        required: true
        enum_values:
          - strict
          - additive
      - name: schema_hash
        type: sha256
        required: true
        unit: sha256
  - name: SupportedProfile
    description: Profile id and evidence floor supported by this release.
    fields:
      - name: profile_id
        type: string
        required: true
      - name: profile_type
        type: string
        required: true
      - name: minimum_evidence_level
        type: string
        required: true
  - name: ReleaseCapability
    description: Capability version and evidence level advertised by the release.
    fields:
      - name: capability_id
        type: string
        required: true
      - name: capability_schema_version
        type: string
        required: true
      - name: evidence_level
        type: string
        required: true
