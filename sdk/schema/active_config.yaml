schema_kind: ranger.schema.v1
schema_id: active_config
schema_version: ranger.active_config.v2
title: Ranger active configuration binding
status: active
owner: sdk/schema
compatibility:
  mode: strict
  unknown_fields: reject
  stable_id_policy: never_reuse
  migration_required: true
hash:
  canonicalization: semantic_projection_v2
  semantic_inputs:
    - schema_kind
    - schema_id
    - schema_version
    - compatibility
    - structures
structures:
  - name: ActiveConfig
    description: Binds the selected release and profile to the exact runtime TOML consumed at startup.
    fields:
      - name: schema_version
        type: string
        required: true
      - name: active_config_id
        type: string
        required: true
      - name: vehicle_id
        type: string
        required: true
      - name: release
        type: object
        required: true
      - name: profile
        type: object
        required: true
      - name: runtime_config
        type: object
        required: true
  - name: ArtifactReference
    description: Identity and location of the selected release or profile artifact.
    fields:
      - name: ref_id
        type: string
        required: true
      - name: path
        type: string
        required: true
      - name: schema_version
        type: string
        required: true
      - name: sha256
        type: sha256
        required: true
        unit: sha256
  - name: RuntimeConfigReference
    description: SHA-256 of the exact runtime TOML bytes selected for startup.
    fields:
      - name: sha256
        type: sha256
        required: true
        unit: sha256
