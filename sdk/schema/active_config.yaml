schema_kind: ranger.schema.v1
schema_id: active_config
schema_version: ranger.active_config.v1
title: Ranger active config schema
status: active
owner: sdk/schema
compatibility:
  mode: strict
  unknown_fields: reject
  stable_id_policy: never_reuse
  migration_required: true
hash:
  canonicalization: yaml_to_canonical_json_v1
  aggregate_member: true
  semantic_inputs:
    - schema_kind
    - schema_id
    - schema_version
    - compatibility
    - structures
structures:
  - name: ActiveConfig
    description: Current release/profile/calibration/safety/runtime references and hashes.
    fields:
      - name: active_config_id
        type: string
        required: true
      - name: vehicle_id
        type: string
        required: true
      - name: release
        type: object
        required: true
      - name: profile
        type: object
        required: true
      - name: calibration
        type: object
        required: true
      - name: safety
        type: object
        required: true
      - name: runtime
        type: object
        required: true
      - name: field_overrides
        type: array
        required: true
        items: FieldOverrideReference
  - name: ArtifactReference
    description: Path, schema version, and hash for active config inputs.
    fields:
      - name: ref_id
        type: string
        required: true
      - name: path
        type: string
        required: true
      - name: schema_version
        type: string
        required: true
      - name: sha256
        type: sha256
        required: true
        unit: sha256
  - name: FieldOverrideReference
    description: Scoped field override that must tighten safety-critical limits.
    fields:
      - name: override_id
        type: string
        required: true
      - name: target_key
        type: string
        required: true
      - name: direction
        type: enum
        required: true
        enum_values:
          - tighten_only
          - non_safety_adjustment
      - name: authorized_by
        type: string
        required: true
      - name: reason
        type: string
        required: true
      - name: expires_at
        type: timestamp_rfc3339
        required: true
      - name: rollback_ref
        type: string
        required: true
