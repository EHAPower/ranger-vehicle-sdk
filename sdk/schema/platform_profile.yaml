schema_kind: ranger.schema.v1
schema_id: platform_profile
schema_version: ranger.platform_profile.v1
title: Ranger platform profile schema
status: active
owner: sdk/schema
compatibility:
  mode: strict
  unknown_fields: reject
  stable_id_policy: never_reuse
  migration_required: true
hash:
  canonicalization: yaml_to_canonical_json_v1
  aggregate_member: true
  semantic_inputs:
    - schema_kind
    - schema_id
    - schema_version
    - compatibility
    - structures
structures:
  - name: PlatformProfileHeader
    description: Stable identity, release compatibility, commissioning, and evidence state.
    fields:
      - name: profile_id
        type: string
        required: true
      - name: vehicle_id
        type: string
        required: true
      - name: profile_type
        type: enum
        required: true
        enum_values:
          - legacy_x86_migration
          - jetson_target
          - hil
          - bench
          - static_vehicle
          - field_release
      - name: release_compatibility
        type: object
        required: true
      - name: commissioning_state
        type: enum
        required: true
        enum_values:
          - Draft
          - Detected
          - Validated
          - PendingReconfirm
          - Active
          - Rejected
          - RolledBack
      - name: evidence_level
        type: enum
        required: true
        enum_values:
          - L0_host_unit
          - L1_target_smoke
          - L2_replay_fault_injection
          - L3_hil
          - L4_bench
          - L5_integrated_bench
          - L6_static_vehicle
          - L7_field_soak
  - name: ComputeOsRt
    description: Compute, OS, RT, affinity, power, thermal, and logging envelope.
    fields:
      - name: compute_target
        type: enum
        required: true
        enum_values:
          - x86_64_industrial_pc
          - jetson_orin_nx
          - hil_host
      - name: target_triple
        type: string
        required: true
      - name: os_version
        type: string
        required: true
      - name: kernel_version
        type: string
        required: true
      - name: rt_kernel
        type: object
        required: true
      - name: cpu_affinity
        type: object
        required: true
      - name: irq_affinity
        type: object
        required: true
      - name: power_thermal
        type: object
        required: true
      - name: storage_logging
        type: object
        required: true
  - name: BusTopology
    description: Explicit bus role, timing, binding, and capability requirements.
    fields:
      - name: bus_id
        type: string
        required: true
      - name: kind
        type: enum
        required: true
        enum_values:
          - ethercat
          - socketcan
          - linkx_can
          - uart
          - udp
          - vendor_sdk
      - name: adapter
        type: string
        required: true
      - name: physical_port
        type: string
        required: true
      - name: os_interface
        type: string
        required: true
      - name: bitrate_or_timing
        type: object
        required: true
      - name: role
        type: enum
        required: true
        enum_values:
          - sensor_can
          - wheel_drive
          - eha_module
          - time_sync
          - maintenance_only
      - name: allowed_traffic
        type: array
        required: true
        items: string
      - name: rate_budget
        type: object
        required: true
      - name: device_binding
        type: object
        required: true
      - name: required_capability
        type: array
        required: true
        items: string
      - name: nic_chipset
        type: string
        required: false
      - name: nic_driver
        type: string
        required: false
      - name: nic_ethtool_config
        type: object
        required: false
  - name: SensorTimeSync
    description: Server-owned sensor contract with clock domain and freshness.
    fields:
      - name: sensor_id
        type: string
        required: true
      - name: owner
        type: enum
        required: true
        enum_values:
          - ranger_server
          - external_sdk_consumer
      - name: source
        type: enum
        required: true
        enum_values:
          - gps
          - livox_imu
          - body_imu
          - wheel_feedback
          - eha_feedback
          - can_sensor
      - name: timestamp_clock
        type: enum
        required: true
        enum_values:
          - monotonic
          - sensor_monotonic
          - gps
          - backend_time
      - name: frequency_hz
        type: float64
        required: true
        unit: hz
      - name: freshness_ms
        type: uint64
        required: true
        unit: ms
      - name: missing_policy
        type: enum
        required: true
        enum_values:
          - reject_motion
          - degrade
          - diagnostics_only
          - ignore_for_control
  - name: BackendMapping
    description: Backend resource, instance, capability, and fault mapping.
    fields:
      - name: backend_id
        type: string
        required: true
      - name: family
        type: enum
        required: true
        enum_values:
          - wheel_backend
          - eha_controller
          - sensor_gateway
          - telemetry_bridge
      - name: protocol_schema
        type: string
        required: true
      - name: resources
        type: array
        required: true
        items: string
      - name: instances
        type: array
        required: true
        items: object
      - name: required_capabilities
        type: array
        required: true
        items: string
      - name: capability_report_hash
        type: sha256
        required: true
        unit: sha256
      - name: stop_confirmation
        type: object
        required: true
      - name: failure_mapping
        type: object
        required: true
