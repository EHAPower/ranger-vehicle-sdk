schema_kind: ranger.schema.v1
schema_id: telemetry_diagnostics
schema_version: ranger.telemetry_diagnostics.v1
title: Ranger telemetry and diagnostics schema
status: active
owner: sdk/schema
compatibility:
  mode: additive
  unknown_fields: allow_append_only
  stable_id_policy: never_reuse
  migration_required: true
hash:
  canonicalization: yaml_to_canonical_json_v1
  aggregate_member: true
  semantic_inputs:
    - schema_kind
    - schema_id
    - schema_version
    - compatibility
    - structures
structures:
  - name: TelemetryChannel
    description: Read-only state channel with unit, freshness, and drop policy.
    fields:
      - name: channel_id
        type: string
        required: true
      - name: diagnostics_path
        type: string
        required: true
      - name: value_type
        type: enum
        required: true
        enum_values:
          - bool
          - uint64
          - float64
          - string
          - object
      - name: unit
        type: enum
        required: false
        enum_values:
          - bool
          - count
          - ms
          - ns
          - percent
          - m
          - mm
          - m_per_s
          - mm_per_s
          - m_per_s2
          - rad_per_s
          - gauss
          - n
          - celsius
          - a
          - us
          - hz
      - name: frequency_hz
        type: float64
        required: false
        unit: hz
  - name: DiagnosticsPath
    description: Stable operator-visible path shared by SDK, CLI, telemetry, and field bundle.
    fields:
      - name: path
        type: enum
        required: true
        enum_values:
          - /actuator/eha[i]/position_m
          - /actuator/eha[i]/velocity_mps
          - /actuator/eha[i]/force_n
          - /actuator/eha[i]/position_cmd_m
          - /actuator/eha[i]/velocity_cmd_mps
          - /actuator/eha[i]/force_cmd_n
          - /actuator/eha[i]/enable
          - /sensor/drawwire[i]/displacement_mm
          - /sensor/drawwire[i]/velocity_mmps
          - /sensor/pressure[j]/force_n
          - /sensor/pressure[j]/temperature_c
          - /wheel[i]/angular_velocity_radps
          - /wheel[i]/current_a
          - /imu/acc_mps2
          - /imu/gyro_radps
          - /imu/mag_gauss
          - /attitude/roll_deg
          - /attitude/pitch_deg
          - /attitude/yaw_deg
          - /attitude/roll_rate_deg_s
          - /attitude/pitch_rate_deg_s
          - /attitude/yaw_rate_deg_s
          - /motion/linear_velocity_mps
          - /motion/yaw_rate_radps
          - /motion/target_age_ms
          - /rc/channels_us
          - /rc/channel_count
          - /rc/rssi
          - /health/rt_heartbeat_age_ms
          - /health/ethercat_heartbeat_age_ms
          - /health/drawwire_heartbeat_age_ms
          - /health/pressure_heartbeat_age_ms
          - /health/drawwire_frames
          - /health/pressure_frames
          - /health/mavlink_rc_frames
          - /health/mavlink_imu_frames
          - /health/mavlink_attitude_frames
          - /health/rt_overruns
          - /health/sensor_timeout_events
          - /safety/estop
      - name: owner
        type: string
        required: true
      - name: mutating
        type: bool
        required: true
      - name: stable_id_policy
        type: enum
        required: true
        enum_values:
          - never_reuse
      - name: index_policy
        type: enum
        required: false
        enum_values:
          - eha0_lf_eha1_rf_eha2_rr_eha3_lr
          - pressure_j_logical_channel_0_to_7
          - not_indexed
      - name: timestamp_clock_domain
        type: enum
        required: false
        enum_values:
          - daemon_monotonic_freshness_ns
      - name: computed_by
        type: enum
        required: false
        enum_values:
          - ranger_daemon
  - name: ReadinessSnapshot
    description: Read-only summary explaining current motion readiness.
    fields:
      - name: schema_version
        type: string
        required: true
      - name: ready_for_motion
        type: bool
        required: true
      - name: motion_disabled_reason
        type: string
        required: false
      - name: release_id
        type: string
        required: false
      - name: profile_id
        type: string
        required: false
      - name: capability_hash
        type: sha256
        required: false
        unit: sha256
      - name: check_registry_hash
        type: sha256
        required: true
        unit: sha256
      - name: ignored_check_count
        type: uint64
        required: true
        unit: count
      - name: reason_codes
        type: array
        required: true
        items: string
      - name: backend_reports
        type: array
        required: true
        items: BackendReadinessSummary
  - name: BackendReadinessSummary
    description: Backend instance readiness rendered for diagnostics clients without touching RT paths.
    fields:
      - name: backend_id
        type: string
        required: true
      - name: instance_id
        type: string
        required: true
      - name: instance_binding
        type: string
        required: true
      - name: resources
        type: array
        required: true
        items: string
      - name: ready_for_motion
        type: bool
        required: true
      - name: diagnostics_only
        type: bool
        required: true
      - name: feedback_freshness_ms
        type: uint64
        required: true
        unit: ms
      - name: safe_output
        type: bool
        required: true
      - name: stop_confirmation_available
        type: bool
        required: true
      - name: fault_reason_codes
        type: array
        required: true
        items: string
      - name: missing_capabilities
        type: array
        required: true
        items: string
