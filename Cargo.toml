[workspace]
resolver = "2"
members = ["crates/contracts", "sdk/rust"]

[workspace.package]
edition = "2024"
version = "0.1.0"
repository = "https://github.com/EHAPower/ranger-vehicle-sdk"

[workspace.dependencies]
contracts = { path = "crates/contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "2"
nix = { version = "0.31.2", features = ["socket", "time"] }
sha2 = "0.10"
